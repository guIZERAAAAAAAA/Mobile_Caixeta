<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensores do smartphone</title>
</head>

<body>
    <h1>Sensores do smartphone</h1>
    <button id="listar-sensores" type="button">Listar sensores</button>
    <ul id="lista-sensores"></ul>
    <script>
        const sensores = ['acelerômetro', 'giroscópio', 'NFC', 'impressão digital'];
        const listaSensores = document.querySelector('#lista-sensores');

        document.querySelector('#listar-sensores').addEventListener('click', () => {
            listaSensores.replaceChildren(
                ...sensores.map(sensor => {
                    const item = document.createElement('li');
                    item.textContent = sensor;
                    return item;
                }),
            );
        });
    </script>
</body>

</html>
